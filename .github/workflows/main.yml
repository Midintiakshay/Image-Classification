name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping_app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping the App Health Endpoint
        # This targets the hidden health check to properly reset the sleep timer
        run: curl -L https://image-classification-m.streamlit.app/_stcore/health
